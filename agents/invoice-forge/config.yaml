# Matrixly InvoiceForge — invoice processing & AR configuration

business:
  name: "Matrixly Demo Co"
  support_email: "ap@example.com"
  timezone: "America/Chicago"
  website: "https://matrixly.world"
  currency: "USD"

# Validation rules
validation:
  require_vendor: true
  require_invoice_number: true
  require_total: true
  require_due_date: false
  max_amount: 500000
  min_amount: 0.01
  # Flag for human review when confidence below this
  confidence_threshold: 0.75
  # Duplicate detection
  check_duplicates: true
  # Allowed currencies
  currencies:
    - USD
    - EUR
    - GBP
    - CAD

# Exception / HITL triggers
exceptions:
  keywords:
    - rush
    - legal
    - disputed
    - wire fraud
  auto_flag_high_amount: 25000
  missing_po_is_exception: true

# AR reminders (days after due date)
ar:
  enabled: true
  reminder_days_after_due:
    - 1
    - 7
    - 14
  aging_buckets:
    - 0
    - 30
    - 60
    - 90

accounting:
  backend: csv  # csv | quickbooks | xero
  export_dir: data/exports

hitl:
  mode: exceptions_only  # always | exceptions_only | off

cors_origins:
  - "http://localhost:8080"
  - "http://127.0.0.1:8080"
  - "http://localhost:8791"
  - "https://matrixly.world"
  - "https://www.matrixly.world"
  - "https://matrixbazaar.com"
  - "https://www.matrixbazaar.com"

rate_limit:
  upload_per_minute: 30
  admin_per_minute: 120

cost:
  input_per_1m_usd: 5.0
  output_per_1m_usd: 15.0

server:
  host: "0.0.0.0"
  port: 8791

xai:
  model: "grok-4-1-fast-reasoning"
  vision_model: "grok-2-vision-1212"
  base_url: "https://api.x.ai/v1"
  temperature: 0.1

channels:
  upload:
    enabled: true
  email:
    enabled: true
  dashboard:
    welcome: "InvoiceForge — review extracted invoices, exceptions, and AR."
