[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --tb=short
markers =
    smoke: critical path UI smoke
    selenium: Selenium WebDriver tests
    playwright: Playwright tests
    bdd: Cucumber-style BDD scenarios
    slow: longer end-to-end checks
filterwarnings =
    ignore::DeprecationWarning
bdd_features_base_dir = features
