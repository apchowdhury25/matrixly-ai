# Matrixly Observability — Promtail ships Docker container logs to Loki
# Focus: Crawl4AI and observability stack containers for agent crawl debugging.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      # Keep container name as label
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
      # Prefer Matrixly stack containers (optional filter — comment out to ship all)
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(matrixly-.*|.*crawl4ai.*|.*prometheus.*|.*grafana.*|.*loki.*|.*promtail.*)"
        action: keep
    pipeline_stages:
      - docker: {}
      # Promote common error patterns for LogQL filtering
      - match:
          selector: '{container=~".*crawl4ai.*"}'
          stages:
            - regex:
                expression: '(?P<level>ERROR|WARN|WARNING|INFO|DEBUG)'
            - labels:
                level:
